services:
  temple:
    build: .
    image: temple-rpc:latest
    container_name: temple-rpc
    restart: unless-stopped
    ports:
      # Mặc định CHỈ nghe localhost (an toàn: không lộ ra Internet).
      # Dùng Tailscale/VPN: đặt BIND_ADDR=<IP tailnet của VPS> trong .env
      # Chỉ đặt 0.0.0.0 khi đã có HTTPS + giới hạn truy cập ở tầng trước.
      - "${BIND_ADDR:-127.0.0.1}:3000:3000"
    environment:
      - PORT=3000
      # Kiến trúc A: KHÔNG tự động kết nối TikTok trên VPS.
      # Phần nghe Live sẽ do máy ở VN đảm nhiệm (bridge ở Phase 2).
      - TIKTOK_USER=
      # Token bảo vệ lệnh điều khiển (HTTP & WS). BẮT BUỘC đặt khi mở ra Internet.
      - RPC_TOKEN=${RPC_TOKEN:-}
    volumes:
      # Dữ liệu công đức + cache giọng đọc: giữ lại khi restart/redeploy
      - temple-data:/app/data
      # Cache model ZeroTTS (HuggingFace): tải 1 lần, dùng mãi
      - temple-hf-cache:/app/.hf-cache

volumes:
  temple-data:
  temple-hf-cache:
